<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 456 456" width="100%" height="100%">
  <!-- Background glow / subtle circle -->
  <circle cx="228" cy="228" r="160" fill="#ffffff" opacity="0.1" />
  
  <!-- Stylized Music Note / MIDI Connection Motif -->
  <path d="M160 310V150l140-40v160" fill="none" stroke="#ffffff" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="160" cy="310" r="32" fill="#ffffff" />
  <circle cx="300" cy="270" r="32" fill="#ffffff" />
  
  <!-- MIDI Node Pin Overlay / Connection Dots -->
  <circle cx="230" cy="130" r="10" fill="#64B5F6" />
  <circle cx="230" cy="170" r="10" fill="#64B5F6" />
  
  <!-- Lyrics Representation (Horizontal text lines below/beside note) -->
  <rect x="120" y="350" width="216" height="12" rx="6" fill="#ffffff" opacity="0.85" />
  <rect x="150" y="380" width="156" height="12" rx="6" fill="#ffffff" opacity="0.5" />
</svg>
